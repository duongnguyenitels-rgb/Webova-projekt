<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" width="800" height="700" font-family="Arial, sans-serif" font-size="16" fill="#000000" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Wireframe domovské stránky KeyZone</title>

  <rect width="800" height="700" fill="#ffffff"/>

  <!-- Hlavička -->
  <rect x="20" y="20" width="760" height="60" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="40" y="57">LOGO</text>
  <text x="560" y="57">Domů   Detail   Kontakt</text>

  <!-- Úvod -->
  <rect x="20" y="100" width="760" height="110" fill="#eeeeee" stroke="#000000" stroke-width="2"/>
  <text x="40" y="140" font-size="22" font-weight="bold">Vítejte v KeyZone</text>
  <text x="40" y="170">podtitulek + krátký text</text>

  <!-- Nadpis sekce -->
  <text x="20" y="250" font-size="20" font-weight="bold">Nejnovější produkty</text>

  <!-- Produkt 1 -->
  <rect x="20" y="270" width="240" height="300" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <rect x="35" y="285" width="210" height="130" fill="#dddddd" stroke="#000000"/>
  <text x="140" y="355" text-anchor="middle">obrázek</text>
  <text x="35" y="445">Název produktu</text>
  <text x="35" y="475">Cena</text>
  <rect x="35" y="500" width="110" height="38" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="90" y="525" text-anchor="middle">Detail</text>

  <!-- Produkt 2 -->
  <rect x="280" y="270" width="240" height="300" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <rect x="295" y="285" width="210" height="130" fill="#dddddd" stroke="#000000"/>
  <text x="400" y="355" text-anchor="middle">obrázek</text>
  <text x="295" y="445">Název produktu</text>
  <text x="295" y="475">Cena</text>
  <rect x="295" y="500" width="110" height="38" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="350" y="525" text-anchor="middle">Detail</text>

  <!-- Produkt 3 -->
  <rect x="540" y="270" width="240" height="300" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <rect x="555" y="285" width="210" height="130" fill="#dddddd" stroke="#000000"/>
  <text x="660" y="355" text-anchor="middle">obrázek</text>
  <text x="555" y="445">Název produktu</text>
  <text x="555" y="475">Cena</text>
  <rect x="555" y="500" width="110" height="38" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="610" y="525" text-anchor="middle">Detail</text>

  <!-- Patička -->
  <rect x="20" y="600" width="760" height="70" fill="#eeeeee" stroke="#000000" stroke-width="2"/>
  <text x="40" y="630">Autor, IČO</text>
  <text x="40" y="655">Mapa webu: Domů | Detail | Kontakt</text>
</svg>
